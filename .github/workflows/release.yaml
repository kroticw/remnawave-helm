name: Release Charts

on:
  push:
    tags:
      - "remnawave-panel-[0-9]+.[0-9]+.[0-9]+"
      - "remnawave-subscription-page-[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Determine changed chart
        id: chart
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == remnawave-panel-* ]]; then
            echo "name=remnawave-panel" >> "$GITHUB_OUTPUT"
            echo "path=charts/remnawave-panel" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == remnawave-subscription-page-* ]]; then
            echo "name=remnawave-subscription-page" >> "$GITHUB_OUTPUT"
            echo "path=charts/remnawave-subscription-page" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown tag format: $TAG" && exit 1
          fi

      - name: Package chart
        run: helm package ${{ steps.chart.outputs.path }}

      - name: Push chart to GHCR
        run: |
          helm push ${{ steps.chart.outputs.name }}-*.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/remnawave-helm
