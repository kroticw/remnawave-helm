{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "remnawave-subscription-page.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remnawave-subscription-page.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.pathFilter.enabled }}
  annotations:
    {{- if .Values.pathFilter.enabled }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.pathFilter.enabled }}
          {{- range include "remnawave-subscription-page.allowedPathRegexes" . | fromYamlArray }}
          - path: {{ . | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "remnawave-subscription-page.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
          {{- else }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "remnawave-subscription-page.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
          {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "remnawave-subscription-page.tlsSecretName" . }}
  {{- end }}
{{- end }}
