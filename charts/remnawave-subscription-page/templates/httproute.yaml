{{- if .Values.httproute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "remnawave-subscription-page.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remnawave-subscription-page.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httproute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.httproute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "remnawave-subscription-page.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
