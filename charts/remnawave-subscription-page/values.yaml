replicaCount: 1

image:
  repository: remnawave/subscription-page
  tag: "8.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext: {}

# Name of an existing Secret containing all required environment variables.
# The secret must contain the following keys:
#   Required:
#     REMNAWAVE_PANEL_URL   - Full URL of the Remnawave panel, must start with
#                             http:// or https:// (e.g. https://panel.example.com)
#     REMNAWAVE_API_TOKEN   - API token created in panel: Settings → API Tokens
#   Optional:
#     APP_PORT              - Service port (default: 3010)
#     CUSTOM_SUB_PREFIX     - Custom root path (no leading/trailing slashes)
#     SUBPAGE_CONFIG_UUID   - UUID of the subscription page config served by the
#                             panel (default: the all-zero UUID). Added in 8.0.0
#     TRUST_PROXY           - Express "trust proxy" setting used to resolve the real
#                             client IP from the trusted hop (default: 1).
#                             Accepts true/false, a hop count, or a comma-separated
#                             list of presets (loopback, linklocal, uniquelocal),
#                             IP addresses and CIDR subnets
#     CADDY_AUTH_API_TOKEN  - X-Api-Key sent to the panel when using "Caddy with
#                             security" or "Tiny Auth"
#     CLOUDFLARE_ZERO_TRUST_CLIENT_ID     - Cloudflare Zero Trust client ID
#     CLOUDFLARE_ZERO_TRUST_CLIENT_SECRET - Cloudflare Zero Trust client secret
#     MARZBAN_LEGACY_LINK_ENABLED  - Enable Marzban legacy links (default: false)
#     MARZBAN_LEGACY_SECRET_KEY    - Secret for Marzban legacy links, required
#                             when MARZBAN_LEGACY_LINK_ENABLED is true
#     MARZBAN_LEGACY_SUBSCRIPTION_VALID_FROM - Cut-off timestamp for legacy links,
#                             e.g. "2025-01-17T15:38:45.065Z"
#     MARZBAN_LEGACY_DROP_REVOKED_SUBSCRIPTIONS - Reject revoked legacy links
#                             (default: false)
#     EGAMES_COOKIE         - Cookie value for the eGames integration
#
# Do NOT put INTERNAL_JWT_SECRET in the secret: the image entrypoint generates a
# fresh value on every start. For the same reason the chart never overrides the
# container command or entrypoint — skipping it leaves the variable unset and the
# config validation aborts the container.
existingSecret: ""

service:
  type: ClusterIP
  port: 3010

# Reject scanner traffic at the proxy instead of letting it reach the application.
#
# The application answers no request that does not resolve to an existing
# subscription: it destroys the TCP connection instead of returning 404. A proxy
# in front sees a closed connection and reports 502 to the client, so internet
# background scanning for /.env, /.git/config or /docs/phpinfo.php shows up as a
# burst of 5xx on your own ingress and wakes up whoever watches for them.
#
# When enabled, only the paths the application actually serves are routed to it
# and everything else gets a 404 from the proxy without reaching a pod.
#
# Disabled by default: turning it on changes which requests reach the
# application, and the default pattern assumes stock subscription links. Review
# it against your own setup first — in particular if you set CUSTOM_SUB_PREFIX,
# a custom SHORT_UUID_METHOD or SHORT_UUID_CUSTOM_PATTERN on the panel, or if
# Marzban legacy links are in use, because those links have a different shape.
#
# This narrows the blast radius, it does not close it: a request for a
# well-formed but non-existent subscription id still reaches the application and
# still ends as a 502. Only the application can fix that properly, by answering
# 404 instead of destroying the connection.
pathFilter:
  enabled: false
  # Regular expression matching one subscription short id, without slashes.
  # The default covers the panel's nanoid alphabet at any supported length and
  # also matches a plain UUID.
  shortUuidPattern: "[0-9A-Za-z_-]{16,64}"
  # Client types the application accepts as the second path segment.
  clientTypes:
    - stash
    - singbox
    - mihomo
    - json
    - v2ray-json
    - clash

# Classic Kubernetes Ingress
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ""
  tls: true
  # Leave empty to auto-generate from host: "<host>-tls"
  tlsSecretName: ""

# Gateway API HTTPRoute (mutually exclusive with ingress)
httproute:
  enabled: false
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostname: ""

# Probes stay on tcpSocket on purpose. The image ships a HEALTHCHECK against
# /internal/health, but that route answers 200 only for loopback requests without
# an X-Forwarded-For header, so a kubelet probe would never pass it.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 20
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
